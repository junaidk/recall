{{define "title"}}Studying {{.Deck.Name}}{{end}}
{{define "body"}}
<div class="study-header">
  <h2>Studying: {{.Deck.Name}}</h2>
  <details class="settings-menu">
    <summary title="Study settings" aria-label="Study settings">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path>
      </svg>
    </summary>
    <div class="settings-panel">
      <label class="settings-option"><span>Autoplay audio</span><input type="checkbox" id="audio-autoplay-toggle"></label>
      <label class="settings-option"><span>Show grammar tables</span><input type="checkbox" id="grammar-show-toggle"></label>
    </div>
  </details>
</div>
<div class="study-toolbar">
  <a href="/decks">← Back to decks</a>
  <span id="session-stats"></span>
  <span id="undo-slot"></span>
</div>

<div id="card-slot"
     hx-get="{{if .InitialCardID}}/review/{{.Deck.ID}}/card/{{.InitialCardID}}{{else}}/review/{{.Deck.ID}}/next{{end}}"
     hx-trigger="load"
     hx-swap="innerHTML">
  Loading…
</div>

<script>
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const slot = document.getElementById('card-slot');
  if (!slot) return;
  if (e.code === 'Space') {
    const sb = slot.querySelector('.show-btn');
    if (sb) { e.preventDefault(); sb.click(); }
  } else if (['Digit1','Digit2','Digit3','Digit4'].includes(e.code)) {
    const n = e.code.slice(-1);
    const btn = slot.querySelector('.grade-buttons button[data-rating="' + n + '"]');
    if (btn) { e.preventDefault(); btn.click(); }
  } else if (e.code === 'KeyU') {
    const ub = document.querySelector('#undo-slot .undo-btn');
    if (ub) { e.preventDefault(); ub.click(); }
  }
});
</script>
{{end}}
{{template "base" .}}
