{{define "base"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Recall{{end}}</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header>
    <h1><a href="/" style="text-decoration:none;color:inherit;">Recall</a></h1>
    <nav>
      {{if .User}}
        <span>{{.User.Username}}</span>
        <form method="post" action="/logout" style="display:inline">
          <button type="submit">Log out</button>
        </form>
      {{else}}
        <a href="/login">Log in</a>
        <a href="/register">Register</a>
      {{end}}
    </nav>
  </header>
  <main>
    {{block "body" .}}{{end}}
  </main>
  <script>
    (function () {
      const KEY = 'recall.audio.autoplay';
      const cb = document.getElementById('audio-autoplay-toggle');
      if (cb) {
        cb.checked = localStorage.getItem(KEY) !== '0';
        cb.addEventListener('change', () => {
          localStorage.setItem(KEY, cb.checked ? '1' : '0');
        });
      }
      function play(audio) { audio.play().catch(() => {}); }
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('.audio-play');
        if (!btn) return;
        const audio = btn.parentElement.querySelector('audio[data-card-audio]');
        if (audio) play(audio);
      });
      document.body.addEventListener('htmx:afterSwap', (e) => {
        if (localStorage.getItem(KEY) === '0') return;
        const audio = e.target.querySelector('audio[data-card-audio]');
        if (audio) play(audio);
      });
    })();
  </script>
</body>
</html>
{{end}}
