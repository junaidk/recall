server:
  addr: ":8080"
  session_secret: "change-me-to-a-long-random-string"

db:
  path: "data/anki.db"

deepl:
  api_key: ""
  api_url: "https://api-free.deepl.com/v2/translate"
  source_lang: "DE"
  target_lang: "EN-US"

import:
  seed_dir: "seed"

# FSRS spaced-repetition tuning. Omit any field to keep the library default.
fsrs:
  # Target probability of recall at next review. Lower → longer intervals,
  # fewer reviews, more forgetting. Typical range: 0.80–0.97.
  request_retention: 0.9
  # Cap on how far out a card can be scheduled, in days.
  maximum_interval: 36500
  # Randomize intervals ±5–15% so batches don't all come due on the same day.
  enable_fuzz: false
  # Maximum number of New cards (state=0) introduced from each deck per day.
  # Once reached, the queue only serves Learning/Review/Relearning cards
  # until the next local-day rollover. Counted per (user, deck).
  new_cards_per_day: 20
